name: probe

on: [push]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Probe
        run: |
          set -x
          mkdir p && cd p
          curl -s https://meta.fabricmc.net/v2/versions/game | python3 -c "import json,sys;print([g['version'] for g in json.load(sys.stdin)[:8]])"
          curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys;print([g['version'] for g in json.load(sys.stdin)[:3]])"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26\.2[^<]*</version>' | tail -5
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5
          for f in gradle.properties build.gradle settings.gradle gradle/wrapper/gradle-wrapper.properties src/main/resources/fabric.mod.json; do echo "=== TEMPLATE $f"; curl -s https://raw.githubusercontent.com/FabricMC/fabric-example-mod/HEAD/$f; done
          curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          python3 -c "import json;m=json.load(open('manifest.json'));print(m['latest']);print([v['id'] for v in m['versions'][:10]])"
          url=$(python3 -c "import json;m=json.load(open('manifest.json'));print([v['url'] for v in m['versions'] if v['id']=='26.2'][0])")
          curl -s $url -o v.json
          python3 -c "import json;v=json.load(open('v.json'));print(v.get('javaVersion'))"
          curl -s $(python3 -c "import json;print(json.load(open('v.json'))['downloads']['client']['url'])") -o client.jar
          mkdir c && cd c && unzip -q ../client.jar && cd ..
          ls c/net/minecraft/resources/ | head -30
          for f in data/minecraft/worldgen/configured_feature/amethyst_geode.json data/minecraft/worldgen/placed_feature/amethyst_geode.json data/minecraft/loot_table/blocks/amethyst_cluster.json data/minecraft/loot_table/blocks/small_amethyst_bud.json data/minecraft/loot_table/blocks/amethyst_block.json data/minecraft/loot_table/blocks/budding_amethyst.json data/minecraft/recipe/amethyst_block.json data/minecraft/advancement/recipes/building_blocks/amethyst_block.json assets/minecraft/items/amethyst_cluster.json assets/minecraft/items/amethyst_block.json assets/minecraft/items/amethyst_shard.json assets/minecraft/models/item/amethyst_cluster.json assets/minecraft/models/block/amethyst_cluster.json assets/minecraft/blockstates/amethyst_cluster.json data/minecraft/tags/block/mineable/pickaxe.json data/minecraft/tags/block/crystal_sound_blocks.json pack.mcmeta version.json; do echo "=== $f"; head -c 3000 c/$f; echo; done
          ls c/data/minecraft/tags/worldgen/biome/ | tr '\n' ' '
          ls c/assets/minecraft/models/item | grep -i amethyst
          curl -sL https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar -o vf.jar
          mkdir src
          for cls in world/level/block/AmethystBlock world/level/block/AmethystClusterBlock world/level/block/BuddingAmethystBlock; do cp c/net/minecraft/$cls.class src/; done
          java -jar vf.jar src/AmethystBlock.class src/AmethystClusterBlock.class src/BuddingAmethystBlock.class out/ >/dev/null 2>&1 || true
          cat out/*.java
          javap -cp c 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' | head -80
          javap -cp c net.minecraft.world.item.Item\$Properties | head -60
          java -jar vf.jar c/net/minecraft/world/level/block/Blocks.class blk/ >/dev/null 2>&1 || true
          grep -n -i -E "amethyst|static Block register\(|private static Block register|public static Block register|setId|ResourceKey<Block> " blk/Blocks.java | head -60
          java -jar vf.jar c/net/minecraft/world/item/Items.class itm/ >/dev/null 2>&1 || true
          grep -n -i -E "AMETHYST|public static Item register|registerBlock\(" itm/Items.java | head -40
          ls c/net/minecraft/sounds/ | head; javap -cp c net.minecraft.world.level.block.SoundType | grep -i amethyst
          javap -cp c net.minecraft.world.level.material.MapColor | grep "public static final" | head -70
          ls c/net/minecraft/world/level/levelgen/ | head -40
          # fabric api
          FAPI=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26\.2[^<]*</version>' | tail -1 | sed 's/<[^>]*>//g')
          echo FAPI=$FAPI
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.pom | grep -E "artifactId|version" | grep -E -A1 "biome|item-group|blockrenderlayer|rendering|registry" | head -40
          for mod in fabric-biome-api-v1 fabric-item-group-api-v1 fabric-rendering-v1 fabric-block-api-v1; do
            v=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.pom | grep -A1 "<artifactId>$mod</artifactId>" | grep -o '<version>[^<]*' | sed 's/<version>//')
            echo "MOD $mod $v"
            [ -n "$v" ] && curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/$mod/$v/$mod-$v.jar -o $mod.jar && unzip -l $mod.jar | grep "api/" | grep class | awk '{print $4}' | head -30
          done
          mkdir fr && cd fr && unzip -q ../fabric-rendering-v1.jar && cd ..
          for c in $(cd fr && find . -path '*api*' -name '*RenderLayer*.class' -o -path '*api*' -name '*ChunkSection*.class' | sed 's#^\./##; s#\.class$##; s#/#.#g'); do javap -cp fr $c; done
          mkdir fb && cd fb && unzip -q ../fabric-biome-api-v1.jar && cd ..
          javap -cp fb net.fabricmc.fabric.api.biome.v1.BiomeModifications | head -20
          javap -cp fb net.fabricmc.fabric.api.biome.v1.BiomeSelectionContext
          javap -cp fb net.fabricmc.fabric.api.biome.v1.BiomeSelectors | head -20
          mkdir fi && cd fi && unzip -q ../fabric-item-group-api-v1.jar && cd ..
          javap -cp fi net.fabricmc.fabric.api.itemgroup.v1.FabricItemGroup
