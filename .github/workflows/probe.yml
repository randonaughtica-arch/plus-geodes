name: probe

on: [push]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Probe
        run: |
          set +e
          mkdir p && cd p
          FAPI=0.161.0+26.2
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.pom > pom.xml
          echo "=== ARTIFACTS"; grep -o '<artifactId>[^<]*' pom.xml | sed 's/<artifactId>//' | tr '\n' ' '; echo
          get() { v=$(grep -A1 "<artifactId>$1</artifactId>" pom.xml | grep -o '<version>[^<]*' | sed 's/<version>//'); curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/$1/$v/$1-$v.jar -o $1.jar; mkdir -p x; (cd x && unzip -qo ../$1.jar); }
          for m in $(grep -o '<artifactId>[^<]*' pom.xml | sed 's/<artifactId>//' | grep -E 'item-group|creative|rendering-v1|blockrenderlayer|block-view|object-builder'); do get $m; done
          echo "=== FABRIC CLASSES"; (cd x && find . -name '*.class' | grep -i -E 'tab|group|layer|chunksection' | grep api)
          for c in $(cd x && find . -name '*.class' | grep api | grep -i -E 'CreativeModeTab|ItemGroup|BlockRenderLayerMap|ChunkSectionLayerMap' | grep -v '\$' | sed 's#^\./##; s#\.class$##; s#/#.#g'); do javap -cp x $c; done
          curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          url=$(python3 -c "import json;m=json.load(open('manifest.json'));print([v['url'] for v in m['versions'] if v['id']=='26.2'][0])")
          curl -s $url -o v.json
          curl -s $(python3 -c "import json;print(json.load(open('v.json'))['downloads']['client']['url'])") -o client.jar
          mkdir c && cd c && unzip -q ../client.jar && cd ..
          echo "=== GEODE CF"; python3 -c "import json;d=json.load(open('c/data/minecraft/worldgen/configured_feature/amethyst_geode.json'));d['config'].pop('blocks');print(json.dumps(d))"
          echo "=== AMETHYST_BUD MODEL"; cat c/assets/minecraft/models/item/amethyst_bud.json
          echo "=== MISSING IDS"; for i in BIOME:bamboo_jungle BIOME:basalt_deltas BIOME:birch_forest BIOME:cherry_grove BIOME:crimson_forest BIOME:deep_dark BIOME:desert BIOME:dripstone_caves BIOME:flower_forest BIOME:frozen_peaks BIOME:frozen_river BIOME:grove BIOME:ice_spikes BIOME:jagged_peaks BIOME:jungle BIOME:lush_caves BIOME:mangrove_swamp BIOME:meadow BIOME:nether_wastes BIOME:old_growth_birch_forest BIOME:plains BIOME:snowy_beach BIOME:snowy_plains BIOME:snowy_slopes BIOME:snowy_taiga BIOME:soul_sand_valley BIOME:sparse_jungle BIOME:stony_peaks BIOME:stony_shore BIOME:sunflower_plains BIOME:swamp BIOME:warped_forest BIOME:windswept_forest basalt blackstone cobbled_deepslate dark_prismarine deepslate dripstone_block end_stone_bricks magma_block mud_bricks nether_wart_block netherrack obsidian orange_terracotta packed_ice packed_mud prismarine purpur_block red_sandstone red_terracotta sandstone smooth_red_sandstone smooth_sandstone snow_block terracotta tuff warped_wart_block water white_terracotta; do case $i in BIOME:*) b=${i#BIOME:}; [ -f c/data/minecraft/worldgen/biome/$b.json ] || echo "missing biome $b";; *) [ -f c/assets/minecraft/blockstates/$i.json ] || [ $i = air ] || [ $i = water ] || echo "missing block $i";; esac; done
          javap -cp c net.minecraft.resources.Identifier | grep static
          javap -cp c net.minecraft.core.Registry | grep -i "static.*register"
          javap -cp c net.minecraft.resources.ResourceKey | grep static
          javap -cp c net.minecraft.tags.TagKey | grep static
          javap -cp c 'net.minecraft.world.level.levelgen.GenerationStep$Decoration' | grep static
          javap -cp c net.minecraft.world.level.levelgen.blockpredicates.BlockPredicateType | grep static
          strings c/net/minecraft/world/level/levelgen/blockpredicates/BlockPredicateType.class | grep -E '^[a-z_]+$' | tr '\n' ' '; echo
          javap -cp c net.minecraft.world.item.CreativeModeTab | grep static
          javap -cp c 'net.minecraft.world.item.CreativeModeTab$Builder'
          javap -cp c net.minecraft.world.item.BlockItem | grep 'BlockItem('
          javap -cp c net.minecraft.core.registries.BuiltInRegistries | grep -E 'BLOCK|ITEM|CREATIVE'
          javap -cp c net.minecraft.core.registries.Registries | grep -E ' BLOCK;| ITEM;| CREATIVE| BIOME;| PLACED'
          curl -sL https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar -o vf.jar
          java -jar vf.jar c/net/minecraft/world/item/Items.class itm/ >/dev/null 2>&1
          grep -n -A8 -E "(public|private) static Item register(Block|Item)\(" itm/Items.java | head -120
          grep -n -B2 -A3 "AMETHYST_CLUSTER\|AMETHYST_SHARD =" itm/Items.java | head -30
          ls c/net/minecraft/client/renderer/chunk/ | head -40
          javap -cp c net.minecraft.client.renderer.ItemBlockRenderTypes | head -30
          java -jar vf.jar c/net/minecraft/client/renderer/ItemBlockRenderTypes.class ibr/ >/dev/null 2>&1; grep -n -i "amethyst\|cutout\|public static" ibr/*.java | head -40
          grep -rl --include=*.json -i "render_type\|\"cutout\"" c/assets/minecraft/models/block | head -5
          echo "=== PREFS"; grep -o -a -E 'translucent|cutout[a-z_]*' c/net/minecraft/client/renderer/block/model/*.class 2>/dev/null | sort | uniq -c | head
